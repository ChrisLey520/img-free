services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      PORT: "3002"
    expose:
      - "3002"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # In production behind nginx, browser calls same-origin /api
        NEXT_PUBLIC_API_BASE: "/api"
    environment:
      PORT: "3000"
    expose:
      - "3000"
    depends_on:
      - api

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Used by nginx.conf for certificate path
      DOMAIN: ${DOMAIN}
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    depends_on:
      - web
      - api

  certbot:
    image: certbot/certbot:latest
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    # For renewal, you can run: docker compose -f docker-compose.prod.yml run --rm certbot renew

