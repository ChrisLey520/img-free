services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    environment:
      PORT: "3002"
    expose:
      - "3002"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # In production behind a reverse proxy, the browser calls same-origin /api
        NEXT_PUBLIC_API_BASE: "/api"
    environment:
      PORT: "3000"
    expose:
      - "3000"
    depends_on:
      - api

  caddy:
    image: caddy:2.9-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - api

volumes:
  caddy_data:
  caddy_config:

