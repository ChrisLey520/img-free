user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
  worker_connections  1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  sendfile        on;
  keepalive_timeout  65;

  # Upstreams inside the Docker network
  upstream img_free_web {
    server web:3000;
  }

  upstream img_free_api {
    server api:3002;
  }

  server {
    listen 80;
    server_name _;

    # ACME challenge (Let's Encrypt)
    location ^~ /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    # Recommended: redirect all HTTP -> HTTPS in public deployments
    location / {
      return 301 https://$host$request_uri;
    }
  }

  server {
    listen 443 ssl http2;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;

    # Reasonable modern TLS defaults
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # ACME challenge (HTTPS path too, harmless)
    location ^~ /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    # API: expose as /api/* but forward to Nest root paths (e.g. /convert)
    location ^~ /api/ {
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      rewrite ^/api/(.*)$ /$1 break;
      proxy_pass http://img_free_api;
    }

    # Web
    location / {
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      proxy_pass http://img_free_web;
    }
  }
}

